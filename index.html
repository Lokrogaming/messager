<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
</head>
<body>
    <h1>Messenger Portal</h1>

    <!-- Nachrichtenanzeige -->
    <div id="chat-box" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; margin-bottom: 10px;">
        <!-- Nachrichten werden hier angezeigt -->
    </div>

    <!-- Nachricht senden -->
    <input type="text" id="message-input" placeholder="Nachricht eingeben" />
    <button onclick="sendMessage()">Senden</button>

    <script>
        // Funktion, um eine Nachricht zu senden
        function sendMessage() {
            const message = document.getElementById("message-input").value;
            if (message.trim() === "") return;

            // Füge die Nachricht zur Chatbox hinzu
            const chatBox = document.getElementById("chat-box");
            const messageElement = document.createElement("div");
            messageElement.textContent = "Du: " + message;
            chatBox.appendChild(messageElement);

            // Leere das Eingabefeld
            document.getElementById("message-input").value = "";

            // Nachricht an den Cloudflare Worker senden
            fetch('https://deine-worker-url.workers.dev/message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                // Empfangene Antwort anzeigen
                const responseMessage = document.createElement("div");
                responseMessage.textContent = "Empfänger: " + data.message;
                chatBox.appendChild(responseMessage);
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error('Fehler:', error);
            });
        }
    </script>
</body>
</html>
